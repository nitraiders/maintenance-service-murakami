<!DOCTYPE html>
<!-- Deployment Timestamp: 2026-05-01T11:15:00 -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンスサービス村上 - 管理画面</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; margin: 20px; }
        h2 { color: #333; margin-bottom: 20px; font-size: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #f0f2f5; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #003399; color: white; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #003399; color: white; border: none; padding: 12px; border-radius: 30px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #002266; }
        button:disabled { background: #ccc; }
        #login-section, #form-section { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .success-msg { color: #28a745; margin-top: 10px; font-weight: bold; display: none; }
        
        /* 投稿一覧のスタイル */
        .item-list { text-align: left; margin-top: 20px; }
        .list-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .item-info { flex-grow: 1; overflow: hidden; }
        .item-meta { font-size: 12px; color: #888; }
        .item-text { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .del-btn { background: #dc3545; padding: 5px 12px; font-size: 12px; width: auto; margin-top: 0; border-radius: 5px; }
        .del-btn:hover { background: #a71d2a; }
        .image-count { margin-top: 6px; color: #666; font-size: 13px; line-height: 1.5; }

        @media (max-width: 430px) {
            html, body { width: 100%; overflow-x: hidden; }
            body { display: block; min-height: 100dvh; padding: 12px; box-sizing: border-box; }
            .card { width: 100%; max-width: none; margin: 0 auto; padding: 18px 14px; border-radius: 14px; box-sizing: border-box; }
            .tabs { width: 100%; gap: 6px; box-sizing: border-box; }
            .tab-btn { flex: 1 1 0; min-width: 0; width: auto; margin-top: 0; padding: 10px 6px; font-size: 14px; white-space: nowrap; }
            input, textarea, select { max-width: 100%; min-width: 0; }
            input[type="file"] { display: block; font-size: 14px; padding: 8px; }
            input[type="file"]::file-selector-button { max-width: 100%; margin-right: 6px; padding: 6px 8px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div id="login-section">
        <h2>管理者ログイン</h2>
        <input type="password" id="admin-pass" placeholder="パスワードを入力">
        <button onclick="checkPassword()">ログイン</button>
    </div>
    <div id="form-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('news')">ニュース投稿</button>
            <button class="tab-btn" onclick="switchTab('faq')">FAQ管理</button>
        </div>

        <!-- ニュース投稿タブ -->
        <div id="news-tab" class="tab-content active">
            <h2>新着情報の投稿</h2>
            <div class="form-group">
                <label>日付</label>
                <input type="date" id="post-date">
            </div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select id="post-category"><option value="新着情報">新着情報</option><option value="作業実績">作業実績</option></select>
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea id="post-content" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>画像 (カメラ/フォルダ)</label>
                <input type="file" id="post-image" accept="image/*" multiple>
                <div class="image-count" id="image-count">選択画像: 0枚（最大5枚）</div>
            </div>
            <button id="submit-btn" onclick="submitPost()">投稿する</button>
            <p class="success-msg" id="news-success">投稿完了！</p>
            
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
            <h2>ニュース管理 (削除)</h2>
            <div id="news-list" class="item-list">
                <p style="color:#888; text-align:center;">読み込み中...</p>
            </div>
        </div>

        <!-- FAQ投稿タブ -->
        <div id="faq-tab" class="tab-content">
            <h2>FAQの追加</h2>
            <div class="form-group">
                <label>質問 (Q)</label>
                <input type="text" id="faq-question" placeholder="例: 見積もりは無料ですか？">
            </div>
            <div class="form-group">
                <label>回答 (A)</label>
                <textarea id="faq-answer" rows="4" placeholder="例: はい、無料です。"></textarea>
            </div>
            <button id="faq-submit-btn" onclick="submitFaq()">FAQを追加する</button>
            <p class="success-msg" id="faq-success">追加完了！</p>
            
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
            <h2>FAQ管理 (削除)</h2>
            <div id="faq-list" class="item-list">
                <p style="color:#888; text-align:center;">読み込み中...</p>
            </div>
        </div>
        
        <p style="margin-top: 30px;"><a href="#" onclick="location.reload()" style="color:#888; font-size:14px; text-decoration:none;">ログアウト</a></p>
    </div>
</div>
<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwHTM0IBJZBHjaPh50R6_4T9rAZhcAnToWTTDr_oiLR292b7ZaReWWQ5FSjMTHkI0dr/exec';
    const CORRECT_PASS = 'msm2724';

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[char]));

    function checkPassword() {
        if (document.getElementById('admin-pass').value === CORRECT_PASS) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('post-date').valueAsDate = new Date();
            loadPosts(); 
            loadFaqs();
        } else { alert('パスワードが違います'); }
    }
    document.getElementById('login-section').style.display = 'block';
    document.getElementById('post-image').addEventListener('change', updateSelectedImageCount);

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tab === 'news') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('news-tab').classList.add('active');
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('faq-tab').classList.add('active');
        }
    }

    let postsData = [];
    let faqsData = [];

    function formatBytes(bytes) {
        if (!Number.isFinite(bytes)) return '不明';
        if (bytes < 1024) return `${bytes}B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
    }

    function estimateDataUrlBytes(dataUrl) {
        const base64 = String(dataUrl || '').split(',')[1] || '';
        return Math.round(base64.length * 0.75);
    }

    function getFileDebugInfo(files) {
        return files.map((file, index) => ({
            index: index + 1,
            name: file.name,
            type: file.type || 'unknown',
            size: file.size,
            sizeLabel: formatBytes(file.size)
        }));
    }

    function updateSelectedImageCount() {
        const fileInput = document.getElementById('post-image');
        const countLabel = document.getElementById('image-count');
        const count = fileInput.files.length;
        if (count > 5) {
            alert('画像は最大5枚まで選択できます');
            fileInput.value = '';
            countLabel.textContent = '選択画像: 0枚（最大5枚）';
            return;
        }
        countLabel.textContent = `選択画像: ${count}枚（最大5枚）`;
        if (count > 0) console.info('[MSM admin] selected images', getFileDebugInfo(Array.from(fileInput.files)));
    }

    async function loadPosts() {
        const listDiv = document.getElementById('news-list');
        try {
            const response = await fetch(GAS_URL);
            const data = await response.json();
            postsData = data.news || [];
            listDiv.innerHTML = '';
            if (postsData.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#888;">投稿はありません</p>';
                return;
            }
            postsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-meta">${escapeHtml(item.date)} [${escapeHtml(item.category)}]</div>
                        <div class="item-text">${escapeHtml(item.content)}</div>
                    </div>
                    <button class="del-btn" onclick="deletePostByIndex(${index})">削除</button>
                `;
                listDiv.appendChild(div);
            });
        } catch (e) {
            listDiv.innerHTML = '<p style="color:red; text-align:center;">一覧の取得に失敗しました</p>';
        }
    }

    async function loadFaqs() {
        const listDiv = document.getElementById('faq-list');
        try {
            const response = await fetch(GAS_URL);
            const data = await response.json();
            faqsData = data.faq || [];
            listDiv.innerHTML = '';
            if (faqsData.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#888;">FAQはありません</p>';
                return;
            }
            faqsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-text">Q: ${escapeHtml(item.question)}</div>
                        <div class="item-meta">A: ${escapeHtml(item.answer)}</div>
                    </div>
                    <button class="del-btn" onclick="deleteFaqByIndex(${index})">削除</button>
                `;
                listDiv.appendChild(div);
            });
        } catch (e) {
            listDiv.innerHTML = '<p style="color:red; text-align:center;">一覧の取得に失敗しました</p>';
        }
    }

    async function deletePostByIndex(index) {
        const item = postsData[index];
        if (!item || !confirm('この投稿を削除しますか？')) return;
        const formattedDate = item.date.replace(/\//g, '-');
        const trimmedContent = String(item.content).trim();
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'delete_news', password: CORRECT_PASS, id: item.id, content: trimmedContent, date: formattedDate })
            });
            alert('削除リクエストを送信しました');
            setTimeout(loadPosts, 2000);
        } catch (e) { alert('エラーが発生しました'); }
    }

    async function deleteFaqByIndex(index) {
        const item = faqsData[index];
        if (!item || !confirm('このFAQを削除しますか？')) return;
        const trimmedQuestion = String(item.question).trim();
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'delete_faq', password: CORRECT_PASS, id: item.id, question: trimmedQuestion })
            });
            alert('削除リクエストを送信しました');
            setTimeout(loadFaqs, 2000);
        } catch (e) { alert('エラーが発生しました'); }
    }

    async function submitPost() {
        const btn = document.getElementById('submit-btn');
        const fileInput = document.getElementById('post-image');
        const content = document.getElementById('post-content').value;
        if (!content) return alert('内容を入力してください');
        const files = Array.from(fileInput.files);
        if (files.length > 5) return alert('画像は最大5枚まで選択できます');
        btn.disabled = true; btn.innerText = files.length ? '画像圧縮中...' : '送信中...';
        try {
            console.info('[MSM admin] submitPost start', {
                category: document.getElementById('post-category').value,
                imageCount: files.length,
                files: getFileDebugInfo(files)
            });
            let base64Images = [];
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `画像圧縮中... (${i + 1}/${files.length})`;
                    base64Images.push(await resizeAndConvert(files[i], i + 1));
                }
                btn.innerText = '送信中...';
            }
            const payload = { action: 'post_news', password: CORRECT_PASS, date: document.getElementById('post-date').value, category: document.getElementById('post-category').value, content: content, image: base64Images[0] || "", images: base64Images };
            const payloadText = JSON.stringify(payload);
            console.info('[MSM admin] post_news payload ready', {
                imageCount: base64Images.length,
                imageSizes: base64Images.map(estimateDataUrlBytes).map(formatBytes),
                payloadSize: formatBytes(new Blob([payloadText]).size)
            });
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: payloadText
            });
            console.info('[MSM admin] post_news fetch completed. no-cors response body is not readable by browser.');
            document.getElementById('news-success').style.display = 'block';
            document.getElementById('post-content').value = ''; fileInput.value = '';
            updateSelectedImageCount();
            setTimeout(() => { document.getElementById('news-success').style.display = 'none'; }, 5000);
            loadPosts();
        } catch (e) {
            console.error('[MSM admin] post_news failed', {
                message: e && e.message,
                stack: e && e.stack,
                files: getFileDebugInfo(files)
            }, e);
            alert(`エラーが発生しました\n${(e && e.message) ? e.message : e}`);
        } finally { btn.disabled = false; btn.innerText = '投稿する'; }
    }

    async function submitFaq() {
        const btn = document.getElementById('faq-submit-btn');
        const question = document.getElementById('faq-question').value;
        const answer = document.getElementById('faq-answer').value;
        if (!question || !answer) return alert('質問と回答の両方を入力してください');
        btn.disabled = true; btn.innerText = '送信中...';
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'post_faq', password: CORRECT_PASS, question: question, answer: answer })
            });
            document.getElementById('faq-success').style.display = 'block';
            document.getElementById('faq-question').value = '';
            document.getElementById('faq-answer').value = '';
            setTimeout(() => { document.getElementById('faq-success').style.display = 'none'; }, 5000);
            loadFaqs();
        } catch (e) { alert('エラーが発生しました'); } finally { btn.disabled = false; btn.innerText = 'FAQを追加する'; }
    }

    function resizeAndConvert(file, index) {
        return new Promise((resolve, reject) => {
            console.info('[MSM admin] image compress start', {
                index,
                name: file.name,
                type: file.type || 'unknown',
                size: formatBytes(file.size)
            });
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 1600;
                        let width = img.width; let height = img.height;
                        if (!width || !height) throw new Error(`画像サイズを取得できません: ${file.name}`);
                        if (Math.max(width, height) > MAX_SIZE) {
                            const ratio = MAX_SIZE / Math.max(width, height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        if (!ctx) throw new Error('Canvasを初期化できません');
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const finish = (dataUrl) => {
                            console.info('[MSM admin] image compress done', {
                                index,
                                name: file.name,
                                outputSize: formatBytes(estimateDataUrlBytes(dataUrl)),
                                width,
                                height
                            });
                            resolve(dataUrl);
                        };
                        if (canvas.toBlob) {
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    reject(new Error(`JPEG変換に失敗しました: ${file.name}`));
                                    return;
                                }
                                const blobReader = new FileReader();
                                blobReader.onload = () => finish(blobReader.result);
                                blobReader.onerror = () => reject(new Error(`圧縮画像の読み込みに失敗しました: ${file.name}`));
                                blobReader.readAsDataURL(blob);
                            }, 'image/jpeg', 0.8);
                        } else {
                            finish(canvas.toDataURL('image/jpeg', 0.8));
                        }
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = () => reject(new Error(`画像をブラウザで読み込めません: ${file.name} (${file.type || 'unknown'})`));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error(`画像ファイルの読み込みに失敗しました: ${file.name}`));
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
